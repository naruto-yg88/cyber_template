<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YG88 — LINK ĐỘC QUYỀN CỔNG QUỐC TẾ</title>
  <link id="favicon" rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Interactive Cyber Particle & Laser Canvas (Identical to llvn.top) -->
  <div class="cyber-canvas-wrap" aria-hidden="true">
    <canvas id="cyber-canvas"></canvas>
  </div>

  <!-- Main Viewport Wrapper -->
  <main class="page-shell">

    <!-- Header Section -->
    <header class="cyber-header">
      <div class="brand-logo-wrap">
        <img id="logo-img" class="brand-logo" src="images/logo.png" alt="LINK ĐỘC QUYỀN CỔNG QUỐC TẾ">
      </div>

      <h1 class="cyber-main-title">
        LINK ĐỘC QUYỀN CỔNG QUỐC TẾ
      </h1>

      <p class="cyber-subtitle">
        Đường truyền bảo mật mã hóa AES-256 an toàn mới nhất
      </p>
    </header>

    <!-- 3D Circular Ring Carousel Stage (10 Countries Orbital Loop) -->
    <div id="coverflow-carousel" class="coverflow-container" aria-label="Danh sách cổng máy chủ quốc tế">
      <!-- Populated dynamically by js/main.js with 10 3D Orbital Cards -->
    </div>

    <!-- Prev / Next Circular Glowing Buttons (Like llvn.top) -->
    <div class="carousel-nav-row">
      <button type="button" id="coverflow-prev" class="nav-orbit-btn" aria-label="Cổng trước">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
      </button>
      <div id="carousel-dots" class="carousel-dots" role="tablist" aria-label="Chọn nhanh quốc gia"></div>
      <button type="button" id="coverflow-next" class="nav-orbit-btn" aria-label="Cổng tiếp theo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>

    <!-- Bottom 4-Cell Security Telemetry Status Bar (Like llvn.top) -->
    <div class="status-capsule" aria-label="Thông số bảo mật hệ thống">
      <div class="status-cell">
        <div class="status-label">GIỜ HỆ THỐNG:</div>
        <div id="status-system-time" class="status-value val-emerald">00:00:00 UTC+7</div>
      </div>
      <div class="status-cell">
        <div class="status-label">IP HIỆN TẠI:</div>
        <div id="status-current-ip" class="status-value val-amber client-real-ip">113.161.72.108</div>
      </div>
      <div class="status-cell">
        <div class="status-label">IP FAKE:</div>
        <div id="status-fake-ip" class="status-value val-cyan">103.253.142.88</div>
      </div>
      <div class="status-cell">
        <div class="status-label">MỨC ĐỘ RỦI RO:</div>
        <div id="status-risk-level" class="status-value val-emerald">AN TOÀN [CHUẨN]</div>
      </div>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
